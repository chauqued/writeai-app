<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyForge — Local AI Revision App</title>

<!-- External Document Parsers (Mammoth for .docx, JSZip for .pptx) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
:root{
  --bg:#08111f;
  --panel:#0e1b2e;
  --panel2:#12233a;
  --border:#203653;
  --text:#edf5ff;
  --muted:#91a4bd;
  --accent:#7c5cff;
  --accent2:#25d0b1;
  --danger:#ff6678;
  --warning:#ffbf69;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background: radial-gradient(circle at top right,#17244d 0,#08111f 38%);
  color:var(--text);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

input[type="text"], input[type="password"], textarea, select {
  width: 100%;
  padding: 10px 14px;
  background: #091524;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  margin-top: 6px;
  margin-bottom: 14px;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent);
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.primary{
  background:linear-gradient(135deg,var(--accent),#9c73ff);
  color:white;
  padding:12px 16px;
  border-radius:11px;
  font-weight:750;
}

.secondary{
  background:#17283f;
  color:#dce9f7;
  padding:11px 15px;
  border-radius:11px;
  border:1px solid var(--border);
}

.danger{
  background:#351722;
  color:#ffb7c0;
  border:1px solid #64303d;
  padding:10px 14px;
  border-radius:10px;
}

.ghost{
  background:transparent;
  color:#aebfd2;
  padding:9px 12px;
}

.full{
  width:100%;
}

/* LANDING */
#landing{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}

.hero{
  max-width:1050px;
  width:100%;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:28px;
  align-items:center;
}

.brand{
  font-size:18px;
  font-weight:800;
  letter-spacing:.4px;
}

.brand span{
  color:var(--accent2);
}

h1{
  font-size:clamp(42px,7vw,76px);
  line-height:.98;
  margin:18px 0;
}

.hero p{
  font-size:18px;
  line-height:1.6;
  color:var(--muted);
  max-width:650px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin:22px 0;
}

.chip{
  padding:8px 12px;
  border:1px solid var(--border);
  background:#0d1a2c;
  border-radius:999px;
  color:#c8d5e6;
  font-size:13px;
}

.auth{
  background:rgba(14,27,46,.9);
  border:1px solid var(--border);
  border-radius:22px;
  padding:26px;
  box-shadow:0 25px 70px #0005;
}

/* APP */
#app{
  display:none;
  min-height:100vh;
}

.layout{
  display:grid;
  grid-template-columns:245px 1fr;
  min-height:100vh;
}

.sidebar{
  border-right:1px solid var(--border);
  background:#091524;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
}

.logo{
  font-weight:900;
  font-size:20px;
  padding:4px 10px 24px;
}

.logo span{
  color:var(--accent2);
}

.nav{
  display:grid;
  gap:6px;
}

.nav button{
  background:transparent;
  color:#8fa4bd;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
}

.nav button.active,
.nav button:hover{
  background:#152640;
  color:white;
}

.userbox{
  position:absolute;
  bottom:16px;
  left:14px;
  right:14px;
  border-top:1px solid var(--border);
  padding-top:15px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:900;
}

.userrow{
  display:flex;
  align-items:center;
  gap:10px;
}

.main{
  padding:26px;
  max-width:1400px;
  width:100%;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  margin-bottom:22px;
}

.topbar h1{
  font-size:30px;
  margin:0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.stat,
.card{
  background:rgba(14,27,46,.82);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
}

.stat .num{
  font-size:27px;
  font-weight:850;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:16px;
  margin-top:16px;
}

.subject-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.subject{
  background:#0d1b2e;
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
}

.subject-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.subject h3{
  margin:0 0 6px;
}

.bar{
  height:7px;
  background:#1c2b40;
  border-radius:99px;
  overflow:hidden;
  margin-top:12px;
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:99px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 12px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.notice{
  padding:11px 13px;
  border-radius:10px;
  background:#11243b;
  border:1px solid var(--border);
  color:#b9cbe0;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid var(--border);
}

/* FLASHCARD DISPLAY */
.flashcard{
  min-height:260px;
  display:grid;
  place-items:center;
  text-align:center;
  background:linear-gradient(145deg,#142641,#0d1a2c);
  border:1px solid var(--border);
  border-radius:20px;
  padding:35px;
  cursor:pointer;
  margin-top: 15px;
}

.flashcard .fc-text{
  font-size:24px;
  font-weight:750;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:20;
}

.modal-box{
  max-width:650px;
  width:100%;
  background:#0e1b2e;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.bottom-nav{
  display:none;
}

@media(max-width:850px){
  .hero, .grid{ grid-template-columns:1fr; }
  .stats{ grid-template-columns:repeat(2,1fr); }
}

@media(max-width:680px){
  .layout{ display:block; }
  .sidebar{ display:none; }
  .main{ padding:18px 14px 82px; }
  .subject-grid{ grid-template-columns:1fr; }
  .bottom-nav{
    position:fixed;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    bottom:0; left:0; right:0;
    background:#091524;
    border-top:1px solid var(--border);
    z-index:10;
  }
  .bottom-nav button{
    background:transparent;
    color:#9db0c7;
    padding:10px 3px;
    font-size:11px;
  }
  .bottom-nav button.active{ color:white; }
}
</style>
</head>

<body>

<!-- LANDING -->
<section id="landing">
  <div class="hero">
    <div>
      <div class="brand">STUDY<span>FORGE</span></div>
      <h1>Turn revision into a system.</h1>
      <p>Upload documents (.docx, .pptx, .pdf, .txt), parse material directly in your browser, and generate structured study artifacts using custom AI.</p>
      <div class="chips">
        <span class="chip">Word Support</span>
        <span class="chip">PowerPoint Support</span>
        <span class="chip">Local Multi-User</span>
        <span class="chip">Private API Key</span>
      </div>
    </div>
    <div class="auth">
      <h2>Select Account</h2>
      <select id="loginUserSelect" style="margin-bottom:12px;"></select>
      <button class="primary full" onclick="loginSelectedUser()">Enter Workspace</button>
    </div>
  </div>
</section>

<!-- MAIN APP -->
<section id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">Study<span>Forge</span></div>
      <div class="nav">
        <button data-page="dashboard" onclick="showPage('dashboard')">▣ &nbsp; Dashboard</button>
        <button data-page="ai" onclick="showPage('ai')">✦ &nbsp; AI Studio & Uploads</button>
        <button data-page="library" onclick="showPage('library')">📚 &nbsp; Saved Library</button>
        <button data-page="settings" onclick="showPage('settings')">⚙ &nbsp; Account & Owner Settings</button>
      </div>
      <div class="userbox">
        <div class="userrow">
          <div class="avatar" id="avatar">G</div>
          <div>
            <b id="userName">Guest</b>
            <div class="small muted" id="userRole">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="page"></div>
    </main>
  </div>

  <div class="bottom-nav">
    <button data-page="dashboard" onclick="showPage('dashboard')">⌂<br>Home</button>
    <button data-page="ai" onclick="showPage('ai')">✦<br>AI Studio</button>
    <button data-page="library" onclick="showPage('library')">📚<br>Library</button>
    <button data-page="settings" onclick="showPage('settings')">⚙<br>Settings</button>
  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
"use strict";

/* =========================================================
   INITIAL DATA & STORAGE
========================================================= */

const DEFAULT_ACCOUNTS = [
  { id: "owner_1", name: "System Owner", role: "owner" },
  { id: "user_1", name: "Alex Student", role: "student" }
];

const DEFAULT_STATE = {
  accounts: DEFAULT_ACCOUNTS,
  activeUserId: "owner_1",
  ownerPasswordHash: "owner123", // Simple local check password
  apiKey: "", // Saved ONLY in browser local storage
  savedMaterials: [] // { id, userId, title, extractedText, date, artifacts: [] }
};

let state = loadState();

function loadState(){
  try {
    const raw = localStorage.getItem("studyforge_v2_state");
    if(!raw) return structuredClone(DEFAULT_STATE);
    return { ...structuredClone(DEFAULT_STATE), ...JSON.parse(raw) };
  } catch(e) {
    return structuredClone(DEFAULT_STATE);
  }
}

function save(){
  localStorage.setItem("studyforge_v2_state", JSON.stringify(state));
}

function getActiveUser(){
  return state.accounts.find(a => a.id === state.activeUserId) || state.accounts[0];
}

function isOwner(){
  return getActiveUser().role === "owner";
}

/* =========================================================
   CORE APP CONTROLLER & NAVIGATION
========================================================= */

function initApp(){
  populateLoginDropdown();
  syncUser();
}

function populateLoginDropdown(){
  const sel = document.getElementById("loginUserSelect");
  if(!sel) return;
  sel.innerHTML = state.accounts.map(a => `<option value="${a.id}">${esc(a.name)} (${a.role})</option>`).join("");
}

function loginSelectedUser(){
  const id = document.getElementById("loginUserSelect").value;
  state.activeUserId = id;
  save();
  document.getElementById("landing").style.display = "none";
  document.getElementById("app").style.display = "block";
  syncUser();
  showPage("dashboard");
}

function syncUser(){
  const user = getActiveUser();
  document.getElementById("avatar").textContent = user.name.charAt(0).toUpperCase();
  document.getElementById("userName").textContent = user.name;
  document.getElementById("userRole").textContent = user.role.toUpperCase();
}

function showPage(page){
  document.querySelectorAll(".nav button, .bottom-nav button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });

  const pageElement = document.getElementById("page");
  if(page === "dashboard") renderDashboard(pageElement);
  if(page === "ai") renderAIStudio(pageElement);
  if(page === "library") renderLibrary(pageElement);
  if(page === "settings") renderSettings(pageElement);

  window.scrollTo({ top:0, behavior:"smooth" });
}

function esc(val){
  return String(val ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function header(title, subtitle=""){
  return `
    <div class="topbar">
      <div>
        <h1>${esc(title)}</h1>${subtitle ? `<div class="muted small">${esc(subtitle)}</div>` : ''}
      </div>
      <div class="notice">
        User: <b>${esc(getActiveUser().name)}</b> (${esc(getActiveUser().role)})
      </div>
    </div>
  `;
}

/* =========================================================
   DOCUMENT EXTRACTION (DOCX & PPTX)
========================================================= */

async function extractTextFromFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  
  if (ext === 'docx') {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
    return result.value;
  } 
  
  if (ext === 'pptx') {
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    let extractedText = "";
    
    // Slide content in pptx lives in ppt/slides/slideX.xml
    const slideFiles = Object.keys(zip.files).filter(fileName => fileName.startsWith("ppt/slides/slide"));
    
    for (let slideFile of slideFiles) {
      const xmlText = await zip.files[slideFile].async("text");
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const textNodes = xmlDoc.getElementsByTagName("a:t");
      for (let node of textNodes) {
        extractedText += node.textContent + " ";
      }
      extractedText += "\n";
    }
    return extractedText.trim();
  }

  if (ext === 'txt') {
    return await file.text();
  }

  throw new Error("Unsupported format. Please upload .docx, .pptx, or .txt files.");
}

/* =========================================================
   AI GENERATION HANDLER (LOCAL STORAGE KEY SAFE)
========================================================= */

async function generateAIArtifact(materialText, mode) {
  if (!state.apiKey) {
    alert("Owner API Key is missing. Please set it under Owner Settings.");
    return null;
  }

  const promptMap = {
    notes: "Create structured, clear study notes from the following text using Markdown headers and key takeaways:",
    flashcards: "Extract key concepts and return ONLY a JSON array of flashcards in the format: [{\"q\": \"Question\", \"a\": \"Answer\"}] from the following text:",
    questions: "Create 5 open-ended short-answer practice questions with model answers from this text:",
    quiz: "Create 5 multiple choice questions and return ONLY a JSON array in the format: [{\"q\": \"Question\", \"options\": [\"A\",\"B\",\"C\",\"D\"], \"a\": \"Correct Option Exact Text\"}] from this text:",
    keyterms: "Identify key terminology and return a structured glossary (Term: Definition) from this text:"
  };

  const systemPrompt = "You are StudyForge, an expert instructional design assistant.";
  const userPrompt = `${promptMap[mode]}\n\n--- MATERIAL ---\n${materialText.slice(0, 8000)}`;

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${state.apiKey}`
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt }
        ],
        temperature: 0.5
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || "AI Request Failed");
    }

    const data = await response.json();
    return data.choices[0].message.content;

  } catch (err) {
    alert("AI Generation Error: " + err.message);
    return null;
  }
}

/* =========================================================
   PAGE: DASHBOARD
========================================================= */

function renderDashboard(element){
  const userMaterials = state.savedMaterials.filter(m => m.userId === state.activeUserId);

  element.innerHTML = header("Dashboard", "Your local revision hub") + `
    <div class="stats">
      <div class="stat">
        <div class="muted small">Saved Materials</div>
        <div class="num">${userMaterials.length}</div>
      </div>
      <div class="stat">
        <div class="muted small">API Key Status</div>
        <div class="num" style="font-size:18px; margin-top:12px;">
          ${state.apiKey ? '🟢 Configured' : '🔴 Unset'}
        </div>
      </div>
      <div class="stat">
        <div class="muted small">Account Type</div>
        <div class="num" style="font-size:20px; margin-top:10px;">${getActiveUser().role.toUpperCase()}</div>
      </div>
      <div class="stat">
        <div class="muted small">Active Accounts</div>
        <div class="num">${state.accounts.length}</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-title">
          <h2>Recent Saved Materials</h2>
          <button class="ghost" onclick="showPage('library')">View Library →</button>
        </div>
        ${userMaterials.length ? userMaterials.slice(-3).reverse().map(m => `
          <div style="padding:12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px;">
            <b>${esc(m.title)}</b>
            <div class="muted small">${m.extractedText.slice(0, 90)}...</div>
          </div>
        `).join('') : '<p class="muted">No materials uploaded yet.</p>'}
      </div>

      <div class="card">
        <div class="section-title"><h2>Quick Actions</h2></div>
        <button class="primary full" onclick="showPage('ai')">✦ Open AI Studio & Upload Documents</button>
        <div style="height:10px"></div>
        <button class="secondary full" onclick="showPage('settings')">⚙ Manage Account Settings</button>
      </div>
    </div>
  `;
}

/* =========================================================
   PAGE: AI STUDIO & FILE UPLOADER
========================================================= */

function renderAIStudio(element){
  element.innerHTML = header("AI Revision Studio", "Extract text from .docx or .pptx and generate revision sets") + `
    <div class="card">
      <h2>1. Document Upload</h2>
      <p class="muted small">Upload Word (.docx) or PowerPoint (.pptx) files to parse directly inside your browser.</p>
      
      <input type="file" id="docPicker" accept=".docx, .pptx, .txt" style="margin-bottom:12px;" />
      <button class="secondary" onclick="processUploadedFile()">Extract File Text</button>
      
      <div style="margin-top:18px;">
        <label class="small muted">Extracted Content Preview</label>
        <textarea id="extractedText" rows="6" placeholder="Extracted material will display here..."></textarea>
      </div>
      
      <button class="primary" onclick="saveExtractedMaterial()">💾 Save Material to Account</button>
    </div>

    <div class="card" style="margin-top:18px;">
      <h2>2. AI Material Generator</h2>
      <p class="muted small">Select an artifact to produce using the extracted text above.</p>
      
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">
        <button class="secondary" onclick="runGenerator('notes')">📝 Study Notes</button>
        <button class="secondary" onclick="runGenerator('flashcards')">🎴 Flashcards</button>
        <button class="secondary" onclick="runGenerator('questions')">❓ Practice Questions</button>
        <button class="secondary" onclick="runGenerator('quiz')">⏱ Timed Quiz</button>
        <button class="secondary" onclick="runGenerator('keyterms')">📖 Key Terms</button>
      </div>

      <div id="aiOutput" class="notice hidden" style="background:#091524; white-space:pre-wrap;"></div>
    </div>
  `;
}

async function processUploadedFile() {
  const picker = document.getElementById("docPicker");
  if(!picker.files.length) return alert("Select a file first!");
  
  const file = picker.files[0];
  try {
    const text = await extractTextFromFile(file);
    document.getElementById("extractedText").value = text;
    alert("Extraction complete!");
  } catch(err) {
    alert("Error reading file: " + err.message);
  }
}

function saveExtractedMaterial() {
  const text = document.getElementById("extractedText").value.trim();
  if(!text) return alert("No material text available to save!");

  const title = prompt("Enter a title for this material:", "Study Document " + new Date().toLocaleDateString());
  if(!title) return;

  state.savedMaterials.push({
    id: "mat_" + Date.now(),
    userId: state.activeUserId,
    title: title,
    extractedText: text,
    date: new Date().toISOString().slice(0,10),
    artifacts: []
  });

  save();
  alert("Saved successfully to your local account library!");
}

async function runGenerator(mode) {
  const text = document.getElementById("extractedText").value.trim();
  if(!text) return alert("Please extract or paste text content first!");

  const out = document.getElementById("aiOutput");
  out.classList.remove("hidden");
  out.textContent = "Generating AI content... Please wait...";

  const result = await generateAIArtifact(text, mode);
  if(result) {
    out.textContent = result;
  } else {
    out.textContent = "Failed to generate artifact.";
  }
}

/* =========================================================
   PAGE: LIBRARY
========================================================= */

function renderLibrary(element){
  const userMaterials = state.savedMaterials.filter(m => m.userId === state.activeUserId);

  element.innerHTML = header("Saved Materials", "Browser-backed study storage") + `
    <div class="card">
      ${userMaterials.length ? userMaterials.map(m => `
        <div style="padding:15px; border:1px solid var(--border); border-radius:12px; margin-bottom:12px; background:#0d1a2c;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${esc(m.title)}</h3>
            <span class="small muted">${m.date}</span>
          </div>
          <p class="small muted">${m.extractedText.slice(0, 200)}...</p>
          <button class="secondary small" onclick="loadMaterialToStudio('${m.id}')">Load into AI Studio</button>
          <button class="danger small" onclick="deleteMaterial('${m.id}')">Delete</button>
        </div>
      `).join('') : '<p class="muted">No saved materials found for your account.</p>'}
    </div>
  `;
}

function loadMaterialToStudio(id) {
  const mat = state.savedMaterials.find(m => m.id === id);
  if(!mat) return;
  showPage('ai');
  setTimeout(() => {
    document.getElementById("extractedText").value = mat.extractedText;
  }, 50);
}

function deleteMaterial(id) {
  state.savedMaterials = state.savedMaterials.filter(m => m.id !== id);
  save();
  renderLibrary(document.getElementById("page"));
}

/* =========================================================
   PAGE: SETTINGS & OWNER CONTROLS
========================================================= */

function renderSettings(element){
  element.innerHTML = header("Settings", "Account management and system owner configuration") + `
    <div class="card">
      <h2>Active Account</h2>
      <p>Logged in as: <b>${esc(getActiveUser().name)}</b> (${esc(getActiveUser().role)})</p>
      <button class="danger" onclick="logout()">Switch Account / Exit</button>
    </div>

    ${isOwner() ? `
      <div class="card" style="margin-top:18px; border-color:var(--accent);">
        <h2>⚙ Owner Settings</h2>
        <p class="muted small">The API key is saved solely in browser local storage for prototype testing.</p>

        <label class="small muted">Owner Password Protection</label>
        <input type="password" id="ownerPassInput" value="${esc(state.ownerPasswordHash)}" placeholder="Set local owner password" />

        <label class="small muted">OpenAI API Key (Stored in Local Storage)</label>
        <input type="password" id="apiKeyInput" value="${esc(state.apiKey)}" placeholder="sk-..." />

        <button class="primary" onclick="saveOwnerSettings()">Save Owner Settings</button>

        <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">

        <h3>Manage User Accounts</h3>
        <table class="table">
          <thead>
            <tr><th>Name</th><th>Role</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${state.accounts.map(a => `
              <tr>
                <td>${esc(a.name)}</td>
                <td>${esc(a.role)}</td>
                <td>
                  ${a.id !== state.activeUserId ? `<button class="danger small" onclick="deleteAccount('${a.id}')">Delete</button>` : '<em>Active</em>'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <h4 style="margin-top:15px;">Add New Account</h4>
        <input type="text" id="newName" placeholder="User Name" />
        <select id="newRole">
          <option value="student">Student</option>
          <option value="owner">Owner</option>
        </select>
        <button class="secondary" onclick="addAccount()">Add User</button>
      </div>
    ` : `
      <div class="card" style="margin-top:18px;">
        <p class="muted">Owner settings are restricted to account managers.</p>
      </div>
    `}
  `;
}

function saveOwnerSettings() {
  if(!isOwner()) return;
  state.ownerPasswordHash = document.getElementById("ownerPassInput").value;
  state.apiKey = document.getElementById("apiKeyInput").value;
  save();
  alert("Owner settings updated successfully!");
}

function addAccount() {
  const name = document.getElementById("newName").value.trim();
  const role = document.getElementById("newRole").value;
  if(!name) return alert("Provide a name!");

  state.accounts.push({
    id: "user_" + Date.now(),
    name: name,
    role: role
  });
  save();
  populateLoginDropdown();
  renderSettings(document.getElementById("page"));
}

function deleteAccount(id) {
  state.accounts = state.accounts.filter(a => a.id !== id);
  save();
  populateLoginDropdown();
  renderSettings(document.getElementById("page"));
}

function logout() {
  document.getElementById("app").style.display = "none";
  document.getElementById("landing").style.display = "grid";
  populateLoginDropdown();
}

// Global initialization
window.onload = initApp;

</script>
</body>
</html>
